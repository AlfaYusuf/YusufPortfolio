<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C3C3C"/>
      <stop offset="100%" style="stop-color:#2D5A5A"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#lcGrad)"/>
  <!-- Chain links -->
  <ellipse cx="35" cy="40" rx="12" ry="8" fill="none" stroke="#4ECCA3" stroke-width="4"/>
  <ellipse cx="50" cy="50" rx="12" ry="8" fill="none" stroke="#4ECCA3" stroke-width="4"/>
  <ellipse cx="65" cy="60" rx="12" ry="8" fill="none" stroke="#4ECCA3" stroke-width="4"/>
  <!-- Connecting lines -->
  <line x1="43" y1="44" x2="42" y2="46" stroke="#4ECCA3" stroke-width="3"/>
  <line x1="58" y1="54" x2="57" y2="56" stroke="#4ECCA3" stroke-width="3"/>
</svg>
